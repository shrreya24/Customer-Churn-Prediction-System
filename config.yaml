# Data Configuration
data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  features_path: "data/features/"
  kaggle_dataset: "blastchar/telco-customer-churn"
  
  # Train-test split
  test_size: 0.2
  random_state: 42
  stratify: true

# Feature Engineering
features:
  # Features to exclude
  exclude_features:
    - "customerID"
    
  # Tenure buckets (in months)
  tenure_buckets:
    - [0, 12, "0-12 months"]
    - [12, 24, "12-24 months"]
    - [24, 48, "24-48 months"]
    - [48, 100, "48+ months"]
  
  # Service features for counting
  service_features:
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"

# Model Configuration
models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42
  
  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 10
    min_samples_leaf: 5
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 3  # for imbalanced data
    random_state: 42
  
  lightgbm:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    num_leaves: 31
    class_weight: "balanced"
    random_state: 42

# Evaluation
evaluation:
  cv_folds: 5
  metrics:
    - "roc_auc"
    - "recall"
    - "precision"
    - "f1"
  threshold: 0.5

# SHAP Configuration
explainability:
  shap_samples: 100  # Number of samples for background dataset
  top_features: 10   # Number of top features to display

# Survival Analysis
survival:
  time_column: "tenure"
  event_column: "Churn"
  confidence_level: 0.95

# Causal/Uplift Modeling
causal:
  treatment_features:
    - "TechSupport"
    - "Contract"
    - "PaperlessBilling"
  meta_learners:
    - "S-learner"
    - "T-learner"
  n_folds: 5

# Output paths
outputs:
  models_path: "outputs/models/"
  figures_path: "outputs/figures/"
  reports_path: "outputs/reports/"
